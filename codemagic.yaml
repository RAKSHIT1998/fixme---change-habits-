# Codemagic build + upload.
#
# Builds on Apple Silicon with current Xcode, which is what satisfies Apple's iOS 26 SDK
# requirement that a 2019 Intel Mac cannot.
#
# Setup (codemagic.io, free tier):
#   1. Sign up, connect this GitHub repository.
#   2. Teams -> Integrations -> App Store Connect: add key RD4DGF9Y57,
#      issuer 6f3b9fe1-e2ff-42e4-9d77-04e29bcc428a, upload the .p8, and name the
#      integration "fixme-asc" to match app_store_connect below.
#   3. Start the ios-release workflow. That is the whole setup.
#
# Signing deliberately does NOT use codemagic-cli-tools' fetch-signing-files. That path
# needs a certificate private key supplied by hand, because Apple's API creates
# certificates but never returns their private half — which cost three failed builds
# ("Cannot save Signing Certificates without certificate private key", then an invalid
# --certificate-key after a pasted PEM lost its newlines).
#
# Instead xcodebuild does its own automatic signing with -allowProvisioningUpdates, given
# the same App Store Connect key. Xcode generates the keypair locally and registers the
# certificate and profile itself, so there is no private key to transport and no extra
# secret to paste. It is the same mechanism used when you hit Archive in the IDE.
workflows:
  ios-release:
    name: Fix Me — archive and upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: fixme-asc
    environment:
      # Holds CERTIFICATE_PRIVATE_KEY_B64 — a stable RSA key, base64 on one line.
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.rakshitbargotra.fixme"
        # Numeric App Store Connect id. The build-number lookup takes this, not the
        # bundle id — passing the bundle id fails and silently falls back to 0, which
        # then collides with an existing build.
        APP_STORE_APP_ID: "6809448798"
        XCODE_SCHEME: "FixMe"
        XCODE_PROJECT: "FixMe.xcodeproj"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      # FixMe.xcodeproj is generated from project.yml and not committed, so it has to be
      # built before anything can reference the scheme.
      - name: Generate the Xcode project
        script: xcodegen generate

      - name: Check the toolchain is new enough
        script: |
          set -e
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then
            echo "Xcode $MAJOR is too old — App Store Connect requires the iOS 26 SDK." >&2
            exit 1
          fi

      # The integration exposes the key as one of three shapes: a reference to a file it
      # already wrote ("@file:/path"), a reference to another variable ("@env:NAME"), or
      # the PEM itself. The first is what Codemagic actually does, and writing that
      # reference string into a file — as this step used to — produces a .p8 containing
      # the literal text "@file:/Users/builder/...", which xcodebuild rejects as an
      # invalid PEM without hinting why.
      - name: Locate the App Store Connect key
        script: |
          set -e
          RAW="$APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -z "$RAW" ]; then
            echo "No App Store Connect integration attached." >&2
            echo "Teams -> Integrations -> App Store Connect, named 'fixme-asc'." >&2
            exit 1
          fi

          case "$RAW" in
            @file:*)
              KEY="${RAW#@file:}"
              ;;
            @env:*)
              KEY="$CM_BUILD_DIR/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
              mkdir -p "$(dirname "$KEY")"
              eval "printf '%b\\n' \"\$${RAW#@env:}\"" > "$KEY"
              ;;
            *)
              KEY="$CM_BUILD_DIR/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
              mkdir -p "$(dirname "$KEY")"
              # %b and the trailing newline both matter: the value may carry literal \n
              # escapes, and a PEM whose last line has no newline is rejected outright.
              printf '%b\n' "$RAW" > "$KEY"
              ;;
          esac

          chmod 600 "$KEY" 2>/dev/null || true
          if ! openssl pkey -in "$KEY" -noout >/dev/null 2>&1; then
            echo "error: $KEY is not a valid private key." >&2
            echo "first line was: $(head -1 "$KEY")" >&2
            exit 1
          fi
          echo "Using App Store Connect key at $KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$CM_ENV"

      - name: Set the build number
        script: |
          set -e
          # Build numbers can never be reused, so take the next one App Store Connect
          # hasn't seen rather than anything stored in the repo.
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          echo "Latest on App Store Connect: $LATEST — using $NEXT"
          echo "BUILD_NUMBER=$NEXT" >> "$CM_ENV"

      # Signing is explicit rather than automatic.
      #
      # xcodebuild's automatic signing worked exactly once. It creates a certificate tied
      # to the machine that asked for it, and every Codemagic runner is thrown away after
      # the build — so the next run got "your account already has a signing certificate
      # for this machine, but its private key is not installed", with an offer to revoke.
      # That is not a workflow, it is a one-shot.
      #
      # Supplying a stable private key fixes it: the certificate is created once, reused
      # on every later run, and nothing accumulates against Apple's certificate cap.
      - name: Prepare signing
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY_B64" ]; then
            echo "CERTIFICATE_PRIVATE_KEY_B64 is not set (group 'appstore')." >&2
            exit 1
          fi
          KEY="$CM_BUILD_DIR/signing_key.pem"
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          if ! openssl rsa -in "$KEY" -check -noout >/dev/null 2>&1; then
            echo "error: CERTIFICATE_PRIVATE_KEY_B64 did not decode to an RSA key." >&2
            exit 1
          fi

          keychain initialize
          # Fetching for the app also creates and saves a profile for the widget, since
          # extensions are part of the same bundle id family.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create --certificate-key "@file:$KEY"
          keychain add-certificates
          # --warn-only because this walks every target, and FixMeTests and FixMeUITests
          # have no App Store profiles and never will.
          xcode-project use-profiles --warn-only || true

      # The project signs automatically (CODE_SIGN_STYLE = Automatic), and the app and
      # its widget need different profiles, which command-line build settings cannot
      # express — they apply to every target at once. So let Xcode resolve signing, with
      # the API key to authorise it.
      #
      # This is what failed on the second-ever build, but the cause was that automatic
      # signing had created a certificate on a machine that no longer existed. The step
      # above now guarantees a certificate whose private key is in this keychain, so
      # there is something for Xcode to find rather than an offer to revoke.
      - name: Archive
        script: |
          set -e
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/FixMe.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export the IPA
        script: |
          set -e
          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>48TGY734WW</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/FixMe.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ls -la "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only. Promoting to review stays a deliberate action in App Store
        # Connect rather than something CI does on a push.
        submit_to_testflight: true
        submit_to_app_store: false
