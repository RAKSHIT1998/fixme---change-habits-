# Fix Me is an Xcode project generated by XcodeGen, not a Swift package — `swift build`
# has no Package.swift to find, and this is an iOS app besides, so it has to be built
# against a simulator rather than the host.
name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    # The .xcodeproj is generated and gitignored; regenerating is the documented way to
    # get one, and it keeps CI honest about project.yml being the source of truth.
    - name: Generate project
      run: xcodegen generate

    # Runner images change their simulator list without warning, so pick whatever iPhone
    # this image actually has rather than pinning a model name that quietly disappears.
    - name: Choose a simulator
      id: sim
      run: |
        UDID=$(xcrun simctl list devices available --json \
          | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; \
              print(next(d['udid'] for rt in sorted(ds) if 'iOS' in rt for d in ds[rt] if 'iPhone' in d['name']))")
        echo "Using simulator $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build and test
      run: |
        xcodebuild test \
          -project FixMe.xcodeproj \
          -scheme FixMe \
          -destination "id=${{ steps.sim.outputs.udid }}" \
          CODE_SIGNING_ALLOWED=NO
