# Archive and upload a build to App Store Connect.
#
# This exists because the project's own Mac cannot do it: a 2019 Intel MacBook Air is
# stuck on macOS Sonoma, and App Store Connect now rejects anything built with an SDK
# older than iOS 26, which needs Xcode 26, which needs Apple Silicon and a newer macOS.
# GitHub's macOS runners are Apple Silicon and carry current Xcode, so the upload happens
# here instead of locally.
#
# Manual only. Uploading a build is deliberate, and build numbers cannot be reused.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   ASC_KEY_ID            App Store Connect API key id, e.g. RD4DGF9Y57
#   ASC_ISSUER_ID         Issuer id (UUID) from Users and Access -> Integrations
#   ASC_KEY_P8_BASE64     base64 of AuthKey_<KEY_ID>.p8
#                           base64 -i AuthKey_XXXX.p8 | pbcopy
#   DIST_CERT_P12_BASE64  base64 of the Apple Distribution certificate exported from
#                         Keychain Access as .p12, including its private key
#                           base64 -i dist.p12 | pbcopy
#   DIST_CERT_PASSWORD    the password set when exporting that .p12
name: Upload to App Store Connect

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 1.0.0). Leave blank to use project.yml."
        required: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Runner images ship several Xcodes. Pick the newest and refuse to continue if it
      # predates 26 — a wasted 40-minute build ending in a 409 from Apple is worse than
      # failing in ten seconds with the reason.
      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          BEST=""
          BEST_VER=0
          for app in /Applications/Xcode*.app; do
            ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            major=${ver%%.*}
            if [ "${major:-0}" -gt "$BEST_VER" ]; then BEST_VER=$major; BEST=$app; fi
          done
          echo "Available: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          if [ "${BEST_VER:-0}" -lt 26 ]; then
            echo "::error::Newest Xcode on this runner is $BEST_VER.x. App Store Connect requires the iOS 26 SDK (Xcode 26+). Try a newer runner label, e.g. macos-26."
            exit 1
          fi
          echo "Using $BEST ($BEST_VER.x)"
          sudo xcode-select -s "$BEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # A throwaway keychain, unlocked for this job only. Never reuse the login keychain
      # on CI: it outlives the step and needs no password to read afterwards.
      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without an interactive prompt, which would hang.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          # A .p12 exported without its private key imports without complaint and then
          # fails much later inside xcodebuild with an opaque signing error. Assert here
          # instead, where the message can say what actually went wrong.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::No Apple Distribution signing identity in the imported .p12. Re-export from Keychain Access using the My Certificates tab, which includes the private key."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          cp "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" ~/.appstoreconnect/private_keys/

      - name: Generate project
        run: xcodegen generate

      # The build number must be unique per upload and can never be reused, so it comes
      # from the run number rather than project.yml, which would collide on the second run.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${MARKETING_VERSION_INPUT}" ]; then
            ARGS+=("MARKETING_VERSION=${MARKETING_VERSION_INPUT}")
          fi
          xcodebuild archive \
            -project FixMe.xcodeproj \
            -scheme FixMe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FixMe.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${ARGS[@]}"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>48TGY734WW</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FixMe.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Validation first: it catches SDK, entitlement, icon and metadata problems and
      # costs a minute, where a rejected upload burns the build number for good.
      - name: Validate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
