# Codemagic build + upload. A third route to App Store Connect, alongside Xcode Cloud
# (ci_scripts/ci_post_clone.sh) and GitHub Actions (.github/workflows/release.yml).
#
# It exists because the other two each depend on something outside the code: Xcode Cloud on
# Apple's onboarding flow, GitHub Actions on an unlocked billing account. This one needs
# only a browser and the App Store Connect API key already in use elsewhere — the build
# runs on Codemagic's Apple Silicon machines, so it satisfies Apple's iOS 26 SDK rule that
# a 2019 Intel Mac cannot.
#
# Setup (codemagic.io, free tier):
#   1. Sign up, connect this GitHub repository.
#   2. Teams -> Integrations -> App Store Connect: add the key
#      RD4DGF9Y57 / issuer 6f3b9fe1-e2ff-42e4-9d77-04e29bcc428a, upload the .p8,
#      and name the integration "fixme-asc" to match app_store_connect below.
#   3. Add an environment variable group named "appstore" containing
#      CERTIFICATE_PRIVATE_KEY_B64 — a base64 copy of an RSA private key, marked secure.
#   4. Start the ios-release workflow.
#
# Why step 3 exists: Apple's API can create a distribution certificate but never returns a
# private key, because that half is generated by whoever requests the certificate. Without
# one the build fails at "Cannot save Signing Certificates without certificate private key".
#
# Why base64 rather than the PEM itself: pasting a multi-line key into a CI variable field
# tends to flatten the newlines, and a PEM without line breaks is unparseable — which
# surfaces as the equally unhelpful 'argument --certificate-key: Provided value "********"
# is not valid'. Base64 is a single line, so there is nothing to mangle.
workflows:
  ios-release:
    name: Fix Me — archive and upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: fixme-asc
    environment:
      # Holds CERTIFICATE_PRIVATE_KEY. codemagic-cli-tools reads that name automatically;
      # it does not need to be passed to any command explicitly.
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.rakshitbargotra.fixme"
        XCODE_SCHEME: "FixMe"
      # Apple rejects anything built against an SDK older than iOS 26.
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      # FixMe.xcodeproj is generated from project.yml and not committed, so it has to be
      # built before anything can reference the scheme.
      - name: Generate the Xcode project
        script: xcodegen generate

      - name: Fail early if the toolchain is too old
        script: |
          set -e
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then
            echo "Xcode $MAJOR is too old — App Store Connect requires the iOS 26 SDK." >&2
            exit 1
          fi

      - name: Fetch signing files
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY_B64" ]; then
            echo "CERTIFICATE_PRIVATE_KEY_B64 is not set." >&2
            echo "Add it to the 'appstore' variable group as a secure variable: an RSA" >&2
            echo "private key, base64-encoded onto a single line. Apple's API creates" >&2
            echo "certificates but never returns a private key, so signing needs one." >&2
            exit 1
          fi

          # A PEM pasted directly into a variable field usually loses its newlines, and the
          # CLI then rejects it as invalid. Decoding to a file keeps the formatting exact.
          KEY_PATH="$CM_BUILD_DIR/signing_key.pem"
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! openssl rsa -in "$KEY_PATH" -check -noout >/dev/null 2>&1; then
            echo "The decoded value is not a valid RSA private key." >&2
            echo "Re-encode with: base64 -i key.pem | tr -d '\\n'" >&2
            exit 1
          fi

          # Any half-pasted value left in the plain variable would still be picked up by
          # name, so clear it and pass the file explicitly instead.
          unset CERTIFICATE_PRIVATE_KEY

          # Order matters: the keychain has to exist before certificates are added to it.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create \
            --certificate-key "@file:$KEY_PATH"
          keychain add-certificates
          xcode-project use-profiles

      - name: Build number
        script: |
          # Build numbers can never be reused, so take the next one App Store Connect
          # hasn't seen rather than anything stored in the repo.
          NEXT=$(($(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0) + 1))
          echo "Using build number $NEXT"
          agvtool new-version -all "$NEXT"

      - name: Archive
        script: |
          xcode-project build-ipa \
            --project "FixMe.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight internal testers only. Promoting to review stays a
        # deliberate action in App Store Connect rather than something CI does.
        submit_to_testflight: true
        submit_to_app_store: false
